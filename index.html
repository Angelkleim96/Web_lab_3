<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Эльф - Странник</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: linear-gradient(145deg, #0a1f1e 0%, #071513 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .game-container { position: relative; background: #1a2a2a; padding: 20px; border-radius: 48px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); }
        
        /* Контейнер для canvas с относительным позиционированием */
        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }
        
        canvas { display: block; margin: 0 auto; border-radius: 24px; box-shadow: 0 0 0 4px #d4af37, 0 0 0 8px #2c2c2c; }
        
        /* Кнопка паузы поверх canvas в левом верхнем углу */
        .pause-btn-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 48px;
            height: 48px;
            backdrop-filter: blur(8px);
            border: 4px solid #d4af37;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            transition: all 0.2s ease;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .pause-btn-overlay:hover {
            
            transform: scale(1.05);
            border-color: #ffeaac;
        }
        
        .pause-btn-overlay:active {
            transform: scale(0.95);
        }
        
        /* Убираем старую панель управления */
        .control-bar {
            display: none;
        }
        
        .ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 12px 24px;
            background: #0f2120e0;
            backdrop-filter: blur(4px);
            border-radius: 60px;
            color: #f7ecc7;
            gap: 32px;
            flex-wrap: wrap;
            border: 1px solid #7eb09e;
        }
        
        .health-bar-container { display: flex; align-items: center; gap: 12px; }
        .health-bar-bg { width: 200px; height: 20px; background: #3a1818; border-radius: 40px; overflow: hidden; }
        .health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #e7582c, #bd2a1a); transition: width 0.1s ease; border-radius: 40px; }
        .coin-display, .level-display { background: #00000066; padding: 6px 18px; border-radius: 40px; font-size: 1.3rem; font-weight: bold; color: #ffeaac; }
        .controls-tip { font-size: 0.75rem; background: #000000aa; padding: 6px 14px; border-radius: 28px; }
        
        .level-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding: 10px;
            background: #0f2120e0;
            border-radius: 60px;
            border: 1px solid #7eb09e;
        }
        
        .level-btn {
            background: #2a4a3a;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-family: monospace;
            font-weight: bold;
            border-radius: 40px;
            color: #ffeaac;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 #1a3a2a;
        }
        
        .level-btn:hover { background: #3a6a4a; transform: translateY(-1px); }
        .level-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a3a2a; }
        .level-btn.active { background: #d4af37; color: #1a2a1a; box-shadow: 0 3px 0 #a08020; }
        
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }
        
        .overlay-content {
            text-align: center;
            background: #1e1a15;
            padding: 40px 60px;
            border-radius: 48px;
            border: 2px solid #d4af37;
        }
        
        .overlay-content h1 { font-size: 2.5rem; color: #d4af37; margin-bottom: 20px; }
        .overlay-content p { color: #ffd966; font-size: 1.2rem; margin-bottom: 30px; }
        .overlay-content button {
            background: #41644a;
            border: none;
            padding: 10px 24px;
            margin: 8px;
            font-size: 1.1rem;
            font-family: monospace;
            font-weight: bold;
            border-radius: 60px;
            color: #ffeaac;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e3a2a;
            transition: 0.05s linear;
        }
        .overlay-content button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e3a2a; }
        .hidden { display: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }
        .floating-score {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 0.8s ease-out forwards;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="1100" height="550"></canvas>
        <!-- Кнопка паузы поверх canvas -->
        <button id="pauseBtnOverlay" class="pause-btn-overlay">❚❚</button>
    </div>
    
    <div class="ui-panel">
        <div class="health-bar-container">
            <div class="health-bar-bg"><div id="healthFill" class="health-fill"></div></div>
        </div>
        <div class="coin-display">🪙 <span id="coinCounter">0</span></div>
        <div class="level-display">🌟 <span id="levelDisplay">1</span></div>
        <div class="controls-tip">🧝 WASD / ПРОБЕЛ - прыжок | 🗡️ E - удар</div>
    </div>
    
    <div class="level-selector">
        <button id="level1Btn" class="level-btn active">🌲 Уровень 1</button>
        <button id="level2Btn" class="level-btn">🏔️ Уровень 2</button>
        <button id="level3Btn" class="level-btn">🔥 Уровень 3</button>
    </div>
    
    <div id="deathScreen" class="overlay hidden">
        <div class="overlay-content">
            <h1>💀 СМЕРТЬ ЭЛЬФА 💀</h1>
            <p>Ты пал в бою...Но душа зовёт в новый путь!</p>
            <button id="restartBtn">✨ ИГРАТЬ ЗАНОВО</button>
        </div>
    </div>
    
    <div id="victoryScreen" class="overlay hidden">
        <div class="overlay-content">
            <h1 id="victoryTitle">🌟 ПОБЕДА</h1>
            <p id="victoryText">Уровень пройден!</p>
            <button id="nextLevelBtn" class="next-level-btn">➡️ СЛЕДУЮЩИЙ</button>
            <button id="resetGameBtn">🔄 НОВАЯ ИГРА</button>
        </div>
    </div>
    
    <!-- Пауза оверлей -->
    <div id="pauseOverlay" class="overlay hidden">
        <div class="overlay-content">
            <h1>⏸️ ПАУЗА</h1>
            <p>Игра приостановлена</p>
            <button id="resumeBtn">▶️ ПРОДОЛЖИТЬ</button>
            <button id="pauseRestartBtn">🔄 НАЧАТЬ ЗАНОВО</button>
        </div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
